<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbos Irregulares · Juego de inglés para 6º de Primaria</title>
<meta name="description" content="Juego para aprender los verbos irregulares en inglés: escucha la pronunciación, completa frases y su traducción al español.">
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #0b1020;
    --card: rgba(255, 255, 255, 0.055);
    --card-strong: rgba(255, 255, 255, 0.09);
    --line: rgba(255, 255, 255, 0.12);
    --ink: #eef2ff;
    --muted: #9aa8c7;
    --gold: #ffd166;
    --ok: #4ade80;
    --bad: #fb7185;
    --study: #4ade80;
    --quiz: #8b7cff;
    --gaps: #22d3ee;
    --listen: #ffb347;
    --arcade: #f472b6;
    --radius: 20px;
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.9);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(1100px 620px at 12% -12%, #2a1a5e 0%, transparent 62%),
      radial-gradient(900px 520px at 92% -6%, #0b3b53 0%, transparent 60%),
      radial-gradient(700px 500px at 50% 110%, #1b1240 0%, transparent 65%),
      var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  button { font: inherit; color: inherit; }

  :focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
    border-radius: 14px;
  }

  .app {
    width: min(100%, 760px);
    margin: 0 auto;
    padding: 14px 16px calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- top bar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-weight: 800;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .brand:hover { background: var(--card-strong); transform: translateY(-1px); }
  .brand__logo { font-size: 1.1rem; }

  .stats { display: flex; gap: 8px; }

  .stat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  .stat b { font-weight: 800; }

  /* ---------- shared bits ---------- */

  .view { outline: none; }

  h1, h2, h3 { letter-spacing: -0.025em; line-height: 1.15; margin: 0; }

  .eyebrow {
    margin: 0 0 6px;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 54px;
    padding: 12px 22px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .btn:hover { background: var(--card-strong); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }

  .btn--primary {
    background: linear-gradient(180deg, #a78bfa, #7c5cff);
    border-color: transparent;
    color: #0b1020;
  }

  .btn--primary:hover { background: linear-gradient(180deg, #b6a1ff, #8b6dff); }

  .btn--ghost { background: transparent; }

  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .speak {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 1.05rem;
    cursor: pointer;
    flex: 0 0 auto;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .speak:hover { background: var(--card-strong); transform: scale(1.06); }
  .speak:active { transform: scale(0.96); }
  .speak--big { width: 78px; height: 78px; font-size: 2rem; border-width: 2px; }
  .speak--listening { animation: pulse 1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 179, 71, 0.5); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(255, 179, 71, 0); }
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--card-strong);
    border: 1px solid var(--line);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hint {
    margin: 10px 0 0;
    font-size: 0.86rem;
    color: var(--muted);
  }

  .banner {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 16px;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid rgba(255, 209, 102, 0.35);
    background: rgba(255, 209, 102, 0.1);
    font-size: 0.88rem;
    color: #ffe9b3;
  }

  /* ---------- home ---------- */

  .hero { margin: 6px 0 20px; }

  .hero h1 {
    font-size: clamp(2rem, 8vw, 2.9rem);
    font-weight: 900;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(120deg, #a78bfa, #22d3ee 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p.lead {
    margin: 10px 0 0;
    color: var(--muted);
    max-width: 46ch;
  }

  .modes {
    display: grid;
    gap: 12px;
    margin-bottom: 18px;
  }

  .mode {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    text-align: left;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent, var(--quiz));
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .mode:hover { transform: translateY(-2px); background: var(--card-strong); }
  .mode:active { transform: translateY(0); }

  .mode__icon {
    display: grid;
    place-items: center;
    width: 50px;
    height: 50px;
    flex: 0 0 auto;
    border-radius: 14px;
    background: color-mix(in srgb, var(--accent, var(--quiz)) 22%, transparent);
    font-size: 1.5rem;
  }

  .mode__body { display: grid; gap: 3px; flex: 1 1 auto; }
  .mode__body b { font-size: 1.06rem; }
  .mode__body small { color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
  .mode__go { color: var(--muted); font-weight: 800; }

  .mode--study { --accent: var(--study); }
  .mode--quiz { --accent: var(--quiz); }
  .mode--gaps { --accent: var(--gaps); }
  .mode--listen { --accent: var(--listen); }
  .mode--arcade { --accent: var(--arcade); }

  /* ---- Arcade (maze mini-game) ---- */
  .arcade { display: grid; gap: 14px; }

  .arcade__hud { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; }

  .arcade__target {
    display: grid;
    gap: 2px;
    flex: 1 1 180px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
  }

  .arcade__label {
    font-size: 0.7rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .arcade__verb { font-size: 1.85rem; line-height: 1.05; }

  .arcade__score {
    display: grid;
    place-items: center;
    gap: 2px;
    min-width: 84px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    font-weight: 800;
  }

  .arcade__score b { font-size: 1.55rem; line-height: 1; color: var(--gold); }

  .arcade__stage {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: #070b16;
  }

  .arcade__canvas { display: block; width: 100%; height: auto; }
  .arcade__hint { margin: 0; text-align: center; color: var(--muted); font-size: 0.86rem; }
  .arcade__actions { display: flex; justify-content: center; }

  .arcade__over {
    display: grid;
    gap: 10px;
    justify-items: center;
    padding: 20px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
  }

  .arcade__over h2 { font-size: 1.4rem; }
  .arcade__over p { margin: 0; color: var(--muted); }
  .arcade__over b { color: var(--gold); font-size: 1.2rem; }

  .progress-card { padding: 16px 18px; }

  .progress-card h2 {
    font-size: 0.78rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .bar {
    height: 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    transition: width 0.4s ease;
  }

  .progress-card p {
    margin: 10px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  /* ---------- study ---------- */

  .screen-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .screen-head h1 { font-size: clamp(1.4rem, 5vw, 1.8rem); flex: 1 1 auto; }

  .verb-card { padding: 18px; margin-bottom: 14px; }

  .verb-card__top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .verb-card__meaning { color: var(--muted); font-size: 0.95rem; }

  .forms { display: grid; gap: 8px; margin-bottom: 16px; }

  .form-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid transparent;
  }

  .form-row--base { border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.09); }

  .form-row__label {
    width: 92px;
    flex: 0 0 auto;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .form-row__value {
    flex: 1 1 auto;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .form-row--base .form-row__value { font-size: 1.55rem; }

  .examples { display: grid; gap: 10px; }

  .example {
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid var(--line);
  }

  .example__en {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 1.02rem;
    font-weight: 700;
  }

  .example__en span { flex: 1 1 auto; padding-top: 6px; }
  .example__es { margin: 4px 0 0 52px; color: var(--muted); font-size: 0.92rem; }
  .example__tag { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; }

  mark {
    background: rgba(255, 209, 102, 0.22);
    color: #ffe9b3;
    padding: 0 4px;
    border-radius: 6px;
  }

  .tip {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(34, 211, 238, 0.1);
    border: 1px solid rgba(34, 211, 238, 0.28);
    font-size: 0.88rem;
    color: #b8f2ff;
  }

  .study-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }

  .study-nav .chip { flex: 0 0 auto; }

  .study-nav__spacer { flex: 1 1 auto; }

  .verb-index { padding: 16px; }

  .verb-index h2 {
    font-size: 0.78rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .search {
    width: 100%;
    min-height: 46px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.25);
    color: var(--ink);
    font: inherit;
    margin-bottom: 12px;
  }

  .search::placeholder { color: var(--muted); }

  .verb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px;
  }

  .verb-grid button {
    padding: 9px 6px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }

  .verb-grid button:hover { background: var(--card-strong); }
  .verb-grid button[aria-current="true"] { border-color: var(--gold); color: var(--gold); }

  /* ---------- round ---------- */

  .round-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .round-top__spacer { flex: 1 1 auto; }

  .dots { display: flex; gap: 6px; margin-bottom: 18px; }

  .dots i {
    height: 6px;
    flex: 1 1 auto;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
  }

  .dots i.is-done { background: var(--ok); }
  .dots i.is-miss { background: var(--bad); }
  .dots i.is-now { background: var(--gold); }

  .prompt { margin-bottom: 16px; }
  .prompt h2 { font-size: clamp(1.35rem, 5.2vw, 1.85rem); font-weight: 800; }
  .prompt .hl { color: var(--gold); }
  .prompt__sub { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; }

  .translation {
    margin: 10px 0 0;
    padding-left: 12px;
    border-left: 3px solid rgba(255, 255, 255, 0.18);
    color: #cfd8f2;
    font-size: 1rem;
    font-style: italic;
  }

  .sentence {
    margin: 14px 0 0;
    padding: 16px 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.6;
  }

  .sentence .blank {
    display: inline-block;
    min-width: 76px;
    border-bottom: 3px solid var(--gold);
    text-align: center;
    color: var(--gold);
  }

  .listen-box {
    display: grid;
    place-items: center;
    gap: 10px;
    padding: 26px 18px;
    border-radius: 18px;
    background: radial-gradient(400px 200px at 50% 0%, rgba(255, 179, 71, 0.18), transparent 70%), rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    margin-top: 14px;
  }

  .listen-box p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .options {
    display: grid;
    gap: 10px;
    grid-template-columns: 1fr;
    margin-top: 18px;
  }

  @media (min-width: 560px) {
    .options { grid-template-columns: 1fr 1fr; }
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 62px;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 1.12rem;
    font-weight: 800;
    text-align: left;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }

  .option:hover:not(:disabled) { transform: translateY(-2px); background: var(--card-strong); border-color: rgba(255, 255, 255, 0.25); }
  .option:disabled { cursor: default; }

  .option__key {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 0.84rem;
    color: var(--muted);
  }

  .option.is-correct {
    border-color: var(--ok);
    background: rgba(74, 222, 128, 0.16);
    color: #d9ffe6;
  }

  .option.is-correct .option__key { background: var(--ok); color: #052e16; }

  .option.is-wrong {
    border-color: var(--bad);
    background: rgba(251, 113, 133, 0.14);
    animation: shake 0.3s ease;
  }

  .option.is-dim { opacity: 0.5; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--card);
  }

  .feedback--ok { border-color: rgba(74, 222, 128, 0.45); background: rgba(74, 222, 128, 0.1); }
  .feedback--bad { border-color: rgba(251, 113, 133, 0.45); background: rgba(251, 113, 133, 0.1); }

  .feedback__head { display: flex; align-items: center; gap: 10px; font-weight: 800; margin-bottom: 6px; }

  .feedback p { margin: 6px 0 0; font-size: 0.95rem; }

  .trio {
    display: flex;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .trio > span {
    display: grid;
    gap: 2px;
    padding: 7px 12px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--line);
  }

  .trio i {
    font-style: normal;
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .trio b { font-size: 1.1rem; }
  .trio .speak { align-self: center; margin-left: 2px; }

  .feedback__meaning { color: var(--muted); }
  .feedback__meaning b { color: var(--ink); }

  .feedback .example { margin-top: 10px; }

  .next-row { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* ---------- result ---------- */

  .result { padding: 26px 20px; text-align: center; }

  .result__emoji { font-size: 3.4rem; line-height: 1; margin-bottom: 8px; }
  .result h2 { font-size: clamp(1.5rem, 6vw, 2rem); }
  .result__score { margin: 10px 0 0; font-size: 1.1rem; color: var(--muted); }
  .result__stars { margin: 14px 0 0; font-size: 1.3rem; font-weight: 800; color: var(--gold); }

  .result__review {
    margin: 18px 0 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    font-size: 0.92rem;
    text-align: left;
  }

  .result__actions { display: grid; gap: 10px; margin-top: 20px; }

  @media (min-width: 560px) {
    .result__actions { grid-template-columns: 1fr 1fr; }
    .result__actions .btn--wide { grid-column: 1 / -1; }
  }

  /* ---------- levels ---------- */

  .levels {
    display: grid;
    gap: 10px;
    margin: 18px 0 6px;
  }

  @media (min-width: 620px) {
    .levels { grid-template-columns: 1fr 1fr; }
  }

  .level {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 13px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .level:hover { background: var(--card-strong); transform: translateY(-1px); }
  .level:active { transform: translateY(0); }
  .level b { font-size: 0.98rem; }
  .level small { color: var(--muted); font-size: 0.78rem; line-height: 1.35; }

  .level.is-current {
    border-color: rgba(139, 124, 255, 0.85);
    background: linear-gradient(180deg, rgba(139, 124, 255, 0.22), rgba(139, 124, 255, 0.07));
    box-shadow: inset 0 0 0 1px rgba(139, 124, 255, 0.35);
  }

  .level.is-current b { color: #cfc4ff; }

  /* ---------- footnote + confetti ---------- */

  .footnote {
    margin: 22px 2px 0;
    font-size: 0.76rem;
    color: rgba(154, 168, 199, 0.75);
    text-align: center;
  }

  .confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* Narrow phones: keep the top bar on one line and the feedback compact. */
  @media (max-width: 470px) {
    .brand { padding: 8px 12px; }
    .brand__text { display: none; }
    .brand__logo { font-size: 1.25rem; }
    .stat { padding: 7px 10px; font-size: 0.9rem; }
  }

  @media (max-width: 540px) {
    .round-top .chip--mode { display: none; }
    .trio > span { padding: 6px 10px; }
    .trio b { font-size: 1rem; }
    .example__es { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Volver al inicio">
      <span class="brand__logo" aria-hidden="true">🔤</span>
      <span class="brand__text">Verbos Irregulares</span>
    </button>
    <div class="stats">
      <span class="stat" title="Estrellas conseguidas">⭐ <b id="stat-stars">0</b></span>
      <span class="stat" title="Mejor racha de aciertos">🔥 <b id="stat-streak">0</b></span>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <p class="footnote">
    La pronunciación usa grabaciones en inglés incluidas con el juego (sin internet).
    Si no están disponibles, se usa la voz en inglés del navegador.
  </p>
</div>

<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

<script src="verbs.js"></script>
<script src="arcade.js"></script>
<script>
"use strict";

/* =========================================================================
   Helpers
   ========================================================================= */

const esc = (value) =>
  String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const rand = (max) => Math.floor(Math.random() * max);

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = rand(i + 1);
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const formsOf = (value) => String(value).split("/").map((part) => part.trim()).filter(Boolean);
const firstForm = (value) => formsOf(value)[0];

/** Text a speech engine should say for a written form. */
function sayForm(verb, form) {
  if (form === "base") return verb.base;
  if (form === "past") return verb.speakPast || firstForm(verb.past);
  return verb.speakParticiple || firstForm(verb.participle);
}
/* =========================================================================
   Progress (localStorage, best effort)
   ========================================================================= */

const STORAGE_KEY = "verbos-irregulares-v1";
// Level 2 is the whole game, so a profile saved before levels existed keeps
// playing exactly what it used to.
const EMPTY_PROFILE = { level: 2, stars: 0, bestStreak: 0, rounds: 0, verbs: {}, arcadeBest: 0 };

function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...EMPTY_PROFILE };
    const parsed = JSON.parse(raw);
    return {
      level: Number(parsed.level) === 1 ? 1 : 2,
      stars: Number(parsed.stars) || 0,
      bestStreak: Number(parsed.bestStreak) || 0,
      rounds: Number(parsed.rounds) || 0,
      arcadeBest: Number(parsed.arcadeBest) || 0,
      verbs: parsed.verbs && typeof parsed.verbs === "object" ? parsed.verbs : {}
    };
  } catch (error) {
    return { ...EMPTY_PROFILE };
  }
}

function saveProfile() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  } catch (error) {
    /* private mode or a blocked storage: the game still works in memory */
  }
}

let profile = loadProfile();

function statsFor(verb) {
  return profile.verbs[verb.base] || { seen: 0, right: 0, wrong: 0 };
}

function recordAnswer(verb, isRight) {
  const stats = statsFor(verb);
  profile.verbs[verb.base] = {
    seen: stats.seen + 1,
    right: stats.right + (isRight ? 1 : 0),
    wrong: stats.wrong + (isRight ? 0 : 1)
  };
  saveProfile();
}

/** Verbs of one level already practised, for the home progress bar. */
const practicedCount = (verbs) => verbs.filter((verb) => statsFor(verb).seen > 0).length;

/** Verbs answered wrongly come back more often; easy ones fade out a bit. */
function weightOf(verb) {
  const stats = statsFor(verb);
  return Math.max(0.4, 1 + stats.wrong * 2 - Math.min(stats.right, 4) * 0.25);
}

function weightedSample(items, count, weightOfItem) {
  const pool = items.map((item) => ({ item, weight: weightOfItem(item) }));
  const picked = [];
  while (picked.length < count && pool.length > 0) {
    const total = pool.reduce((sum, entry) => sum + entry.weight, 0);
    let ticket = Math.random() * total;
    let index = pool.length - 1;
    for (let i = 0; i < pool.length; i += 1) {
      ticket -= pool[i].weight;
      if (ticket <= 0) { index = i; break; }
    }
    picked.push(pool[index].item);
    pool.splice(index, 1);
  }
  return picked;
}

/* =========================================================================
   Speech (browser voices, no audio files)
   ========================================================================= */

const Speech = (() => {
  const synth = typeof window !== "undefined" ? window.speechSynthesis : null;
  const supported = Boolean(synth) && typeof window.SpeechSynthesisUtterance === "function";
  let voice = null;
  let voiceMissing = false;
  let listener = () => {};

  const PREFERRED = ["Google UK English Female", "Microsoft Sonia", "Microsoft Libby", "Sonia", "Libby", "Hazel", "Samantha", "Karen", "Daniel"];

  function pickVoice() {
    if (!supported) return null;
    const voices = synth.getVoices() || [];
    const english = voices.filter((candidate) => /^en(-|_|$)/i.test(candidate.lang || ""));
    if (english.length === 0) return null;

    for (const name of PREFERRED) {
      const match = english.find((candidate) => candidate.name.toLowerCase().includes(name.toLowerCase()));
      if (match) return match;
    }
    return english.find((candidate) => /^en-GB/i.test(candidate.lang)) || english[0];
  }

  function refresh() {
    voice = pickVoice();
    voiceMissing = !voice;
    listener(voiceMissing);
  }

  if (supported) {
    refresh();
    synth.addEventListener?.("voiceschanged", refresh);
  }

  return {
    supported,
    onChange(callback) {
      listener = callback;
      callback(voiceMissing);
    },
    get missing() { return voiceMissing; },
    get voiceName() { return voice ? voice.name : ""; },
    say(text, options = {}) {
      if (!supported || !text) return false;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = voice ? voice.lang : "en-GB";
      utterance.rate = options.rate || 0.85;
      utterance.pitch = 1;
      if (voice) utterance.voice = voice;
      utterance.onend = typeof options.onend === "function" ? options.onend : null;
      try {
        synth.cancel();
        synth.speak(utterance);
      } catch (error) {
        return false;
      }
      return true;
    },
    stop() {
      if (supported) synth.cancel();
    }
  };
})();

/* =========================================================================
   Audio playback: recorded clips first, browser voice as fallback
   ========================================================================= */

const CLIP_ROOT = "assets/audio/";
const clipOf = (verb, form) => `${CLIP_ROOT}${verb.base}/${form}.mp3`;
const exampleClip = (verb, example) =>
  `${CLIP_ROOT}${verb.base}/example-${verb.examples.indexOf(example) + 1}.mp3`;

/*
 * One recorded clip together with the text the browser voice must say when that
 * file is missing, so a gap in the recordings never silences the rest.
 */
const clipEntry = (verb, form) => ({ clip: clipOf(verb, form), text: sayForm(verb, form) });
const exampleEntry = (verb, example) => ({ clip: exampleClip(verb, example), text: example.en });

const FORM_LABELS = { base: "Infinitivo", past: "Pasado", participle: "Participio" };

/** The forms the current level teaches, as clip entries. */
const formEntries = (verb) => currentLevel().forms.map((form) => clipEntry(verb, form));

/** The same forms, ready to paint on the card and in the correction. */
const formRows = (verb) =>
  currentLevel().forms.map((form) => ({ form, label: FORM_LABELS[form], value: verb[form] }));

/** A button that plays recorded clips, falling back to the browser voice. */
function speakerButton(text, label, extraClass, clips) {
  const entries = (Array.isArray(clips) ? clips : clips ? [clips] : []).map((entry) =>
    typeof entry === "string" ? { clip: entry, text } : entry
  );
  const paths = entries.map((entry) => entry.clip);
  const texts = entries.map((entry) => entry.text);
  return `<button class="speak ${extraClass || ""}" data-action="speak" data-say="${esc(text)}" data-clips='${esc(JSON.stringify(paths))}' data-clip-texts='${esc(JSON.stringify(texts))}' aria-label="Escuchar ${esc(label)}">🔊</button>`;
}

const Player = (() => {
  let queue = [];
  let current = null;
  let fileMode = null; // null: unknown yet · true: clips play · false: use the synth voice
  let probeDone = false;
  let runId = 0; // bumped on every stop, so a cancelled voice cannot advance us
  let speaking = false; // the browser voice is reading an entry right now
  let playing = false; // a clip element is loading or playing an entry
  let played = 0; // clips that actually started, for tests and diagnostics
  let voiceGuard = null; // watchdog for a voice that never reports the end
  /** Clips already found broken: later rounds skip them straight to the voice. */
  const missingClips = new Set();
  // The game only ever asks for its own clips, so this set is bounded by the
  // dataset; the cap is a guard against a markup bug inventing paths.
  const MISSING_LIMIT = 64;

  function rememberMissing(clip) {
    missingClips.add(clip);
    if (missingClips.size > MISSING_LIMIT) missingClips.delete(missingClips.values().next().value);
  }

  /** Media errors that mean a clip is really broken (not a mere abort). */
  const realErrorCode = (audio) => {
    const code = audio.error && audio.error.code;
    return code === 2 || code === 3 || code === 4 ? code : null;
  };

  function detach(audio) {
    audio.onended = null;
    audio.onerror = null;
  }

  function stop() {
    runId += 1;
    queue = [];
    speaking = false;
    playing = false;
    if (voiceGuard) {
      clearTimeout(voiceGuard);
      voiceGuard = null;
    }
    if (current) {
      const audio = current;
      current = null;
      detach(audio);
      audio.pause();
      // Clearing the source aborts the media element; without handlers attached
      // the ensuing (harmless) error/emptied events are ignored.
      audio.removeAttribute("src");
      audio.load();
    }
    Speech.stop();
  }

  /** Read one entry with the browser voice, then carry on with the queue. */
  function speakEntry(entry) {
    const id = runId;
    if (!entry.text) {
      next();
      return;
    }
    speaking = true;
    const done = () => {
      if (voiceGuard) {
        clearTimeout(voiceGuard);
        voiceGuard = null;
      }
      speaking = false;
      if (id === runId) next();
    };
    // A browser with no voice engine behind it never fires `end`. Without this
    // guard one silent sentence would strand the rest of the queue.
    voiceGuard = setTimeout(() => {
      Speech.stop();
      done();
    }, 600 + entry.text.length * 70);
    const started = Speech.say(entry.text, { onend: done });
    if (!started) done();
  }

  function next() {
    const entry = queue.shift();
    if (entry === undefined) return;
    if (missingClips.has(entry.clip)) {
      speakEntry(entry);
      return;
    }
    const audio = current || new Audio();
    detach(audio);
    current = audio;
    playing = true;
    audio.src = entry.clip;
    audio.onended = () => {
      playing = false;
      detach(audio);
      next();
    };
    audio.onerror = () => {
      if (audio.src && realErrorCode(audio)) {
        // Only this clip is broken or missing: remember it and let the browser
        // voice read it, so the other recordings keep playing.
        rememberMissing(entry.clip);
        playing = false;
        detach(audio);
        current = null;
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        speakEntry(entry);
      } else {
        // Aborted load (usually cleared mid-flight): not evidence about the clips.
        stop();
      }
    };
    audio
      .play()
      .then(() => {
        played += 1;
      })
      .catch(() => {
        /* Autoplay policies reject playback without a user gesture; the next
           click will play normally. Only stop counting this entry when it is
           still the one in flight: a stale rejection must not clear a newer
           clip that a later say() already started. */
        if (current === audio) playing = false;
      });
  }

  return {
    get fileMode() {
      return fileMode;
    },
    /** Entries still in flight: queued, playing or being read by the voice. */
    get pending() {
      return queue.length + (playing ? 1 : 0) + (speaking ? 1 : 0);
    },
    /** Clips that really started playing in this session. */
    get played() {
      return played;
    },
    /** Clips known to be missing, so a later round can check them. */
    get missing() {
      return [...missingClips];
    },
    /** clips: {clip, text} entries or plain paths · text: overall fallback. */
    say(clips, text) {
      stop();
      const entries = (clips || []).map((entry) =>
        typeof entry === "string" ? { clip: entry, text } : entry
      );
      if (entries.length > 0 && fileMode !== false) {
        // Recorded audio is the default; if the probe has not answered yet we
        // still try optimistically: a broken clip is handled on its own error.
        queue = entries;
        next();
        return;
      }
      fileMode = false;
      const id = runId;
      Speech.say(text, {
        onend: () => {
          if (id === runId) next();
        }
      });
    },
    stop,
    /** Boot probe: do we have recorded audio in this environment? */
    probe(url) {
      return new Promise((done) => {
        const audio = new Audio();
        audio.preload = "auto";
        audio.style.display = "none";
        let settled = false;
        const verdict = (ok) => {
          if (settled) return;
          settled = true;
          probeDone = true;
          fileMode = ok;
          audio.removeAttribute("src");
          audio.load();
          done(ok);
        };
        audio.addEventListener("loadedmetadata", () => verdict(true), { once: true });
        audio.addEventListener("canplaythrough", () => verdict(true), { once: true });
        audio.addEventListener("error", () => {
          // Only a real load/decode failure decides; aborts are retried once.
          if (realErrorCode(audio)) {
            verdict(false);
          } else {
            audio.src = url;
          }
        }, { once: true });
        setTimeout(() => verdict(false), 6000);
        audio.src = url;
        (document.body || document.documentElement).appendChild(audio);
      });
    }
  };
})();

/* =========================================================================
   Tiny sound effects (WebAudio, no files)
   ========================================================================= */

const Sfx = (() => {
  let context = null;

  function audio() {
    if (context) return context;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { context = new Ctx(); } catch (error) { return null; }
    return context;
  }

  function tone(frequency, start, duration, type, gainValue) {
    const ctx = audio();
    if (!ctx) return;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, ctx.currentTime + start);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(gainValue, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + duration);
    oscillator.connect(gain).connect(ctx.destination);
    oscillator.start(ctx.currentTime + start);
    oscillator.stop(ctx.currentTime + start + duration + 0.03);
  }

  return {
    right() { tone(784, 0, 0.12, "sine", 0.12); tone(1175, 0.09, 0.16, "sine", 0.1); },
    wrong() { tone(196, 0, 0.18, "triangle", 0.1); tone(147, 0.1, 0.22, "triangle", 0.08); },
    finish() { [523, 659, 784, 1047].forEach((note, i) => tone(note, i * 0.11, 0.22, "sine", 0.09)); }
  };
})();

/* =========================================================================
   Confetti
   ========================================================================= */

let confettiFrame = 0;

function stopConfetti() {
  const canvas = document.getElementById("confetti");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  cancelAnimationFrame(confettiFrame);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const canvas = document.getElementById("confetti");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const colors = ["#ffd166", "#8b7cff", "#22d3ee", "#4ade80", "#fb7185"];
  const pieces = Array.from({ length: 90 }, () => ({
    x: window.innerWidth / 2 + (Math.random() - 0.5) * 220,
    y: window.innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 12,
    vy: -6 - Math.random() * 9,
    size: 5 + Math.random() * 7,
    spin: (Math.random() - 0.5) * 0.35,
    angle: Math.random() * Math.PI,
    color: colors[rand(colors.length)]
  }));

  let frame = 0;
  function tick() {
    frame += 1;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (const piece of pieces) {
      piece.vy += 0.28;
      piece.x += piece.vx;
      piece.y += piece.vy;
      piece.angle += piece.spin;
      ctx.save();
      ctx.translate(piece.x, piece.y);
      ctx.rotate(piece.angle);
      ctx.fillStyle = piece.color;
      ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size * 0.6);
      ctx.restore();
    }
    if (frame < 130) confettiFrame = requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
  confettiFrame = requestAnimationFrame(tick);
}

/* =========================================================================
   Round building
   ========================================================================= */

const ROUND_SIZE = 10;
const MODES = {
  study: { name: "Tarjetas", icon: "🃏", accent: "var(--study)" },
  quiz: { name: "Quiz", icon: "⚡", accent: "var(--quiz)" },
  gaps: { name: "Frases", icon: "✏️", accent: "var(--gaps)" },
  listen: { name: "Escucha", icon: "🎧", accent: "var(--listen)" },
  arcade: { name: "Arcade", icon: "👾", accent: "var(--arcade)" }
};

/* =========================================================================
   Levels
   ========================================================================= */

/** Level 1 verbs, in the order the level teaches them. */
const LEVEL_ONE_BASES = [
  "awake",
  "be",
  "beat",
  "become",
  "begin",
  "bend",
  "bet",
  "bind",
  "bite",
  "bleed"
];

const LEVELS = {
  1: {
    number: 1,
    name: "Nivel 1",
    lead: "El infinitivo y el pasado",
    forms: ["base", "past"],
    bases: LEVEL_ONE_BASES
  },
  2: {
    number: 2,
    name: "Nivel 2",
    lead: "Las tres formas",
    forms: ["base", "past", "participle"],
    bases: null // every verb in verbs.js
  }
};

const currentLevel = () => LEVELS[profile.level] || LEVELS[2];
const showsParticiple = () => currentLevel().forms.includes("participle");

/** The verbs of one level: the level's own list, or the whole dataset. */
function verbsOfLevel(level = currentLevel()) {
  if (!level.bases) return VERBS;
  return level.bases.map((base) => VERBS.find((verb) => verb.base === base)).filter(Boolean);
}

function setLevel(level) {
  const chosen = LEVELS[level];
  if (!chosen || chosen.number === profile.level) return;
  profile.level = chosen.number;
  saveProfile();
  state.round = null;
  state.study.index = 0;
  state.view = "home";
  if (location.hash) location.hash = "";
  else render();
}

/** All single-word variants of a form, used as plausible wrong answers. */
function distractorPool(verbs, form) {
  const words = new Set();
  for (const verb of verbs) {
    for (const word of formsOf(verb[form])) {
      if (!word.includes(" ")) words.add(word);
    }
  }
  return [...words];
}

/** Wrong-answer pool of the current level, so no outside word leaks into it. */
const poolCache = new Map();
function poolFor(form) {
  const key = `${profile.level}:${form}`;
  if (!poolCache.has(key)) poolCache.set(key, distractorPool(verbsOfLevel(), form));
  return poolCache.get(key);
}

function optionsFor(correct, pool) {
  const wrong = shuffle(pool.filter((word) => word.toLowerCase() !== correct.toLowerCase())).slice(0, 3);
  return shuffle([correct, ...wrong]);
}

function blankSentence(sentence, target) {
  const safe = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return sentence.replace(new RegExp(`\\b${safe}\\b`, "i"), "____");
}

function pairExample(verb, form) {
  return verb.examples.find((example) => example.form === form) || verb.examples[0];
}

function buildQuestion(mode, verb) {
  const past = pairExample(verb, "past");
  const participle = pairExample(verb, "participle");
  const withParticiple = showsParticiple();

  if (mode === "quiz") {
    const form =
      withParticiple && verb.participle !== verb.past && Math.random() < 0.5 ? "participle" : "past";
    const correct = form === "past" ? verb.past : verb.participle;
    return {
      verb,
      form,
      prompt: `¿Cuál es el <b class="hl">${form === "past" ? "pasado" : "participio"}</b> de <b class="hl">${esc(verb.base)}</b>?`,
      sub: `«${esc(verb.base)}» significa “${esc(verb.es)}”`,
      options: optionsFor(correct, poolFor(form)),
      correct,
      answerKind: "form",
      speak: sayForm(verb, "base"),
      example: form === "past" ? past : participle
    };
  }

  if (mode === "gaps") {
    const example = !withParticiple || Math.random() < 0.5 ? past : participle;
    const correct = example.target;
    const pool = poolFor(example.form);
    return {
      verb,
      form: example.form,
      prompt: "Completa la frase",
      sub: example.form === "past" ? "Usa el pasado simple" : "Usa el participio (con have / has)",
      sentence: blankSentence(example.en, correct),
      options: optionsFor(correct, pool),
      correct,
      answerKind: "gap",
      speak: example.en,
      example
    };
  }

  // listen: hear a form, then choose the verb
  const form = withParticiple && verb.participle !== verb.past && Math.random() < 0.4 ? "participle" : "past";
  const spokenLabel = sayForm(verb, form);
  const levelVerbs = verbsOfLevel();
  const verbOptions = shuffle(
    [verb, ...shuffle(levelVerbs.filter((candidate) => candidate.base !== verb.base)).slice(0, 3)]
  ).map((candidate) => candidate.base);
  return {
    verb,
    form,
    prompt: "¿Qué verbo has oído?",
    sub: "Pulsa el altavoz para escucharlo otra vez",
    options: verbOptions,
    correct: verb.base,
    answerKind: "verb",
    speak: spokenLabel,
    heard: spokenLabel,
    example: form === "past" ? past : participle
  };
}

function startRound(mode) {
  stopConfetti();
  const levelVerbs = verbsOfLevel();
  const verbs = weightedSample(levelVerbs, Math.min(ROUND_SIZE, levelVerbs.length), weightOf);
  state.round = {
    mode,
    level: profile.level,
    items: verbs.map((verb) => buildQuestion(mode, verb)),
    index: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    starsEarned: 0,
    misses: [],
    answered: null
  };
  state.view = "play";
  render();
  speakCurrentIfNeeded();
}

/* =========================================================================
   State + routing
   ========================================================================= */

const state = {
  view: "home",
  round: null,
  study: { index: 0, filter: "" },
  lastRound: null,
  arcade: null
};

const view = document.getElementById("view");

function go(target) {
  stopConfetti();
  stopArcade();
  if (target === "arcade") {
    startArcade();
    if (location.hash.slice(1) !== target) location.hash = `#${target}`;
    return;
  }
  if (target === "home") {
    state.round = null;
    state.view = "home";
  } else if (target === "study") {
    state.view = "study";
  } else if (MODES[target]) {
    startRound(target);
    if (location.hash.slice(1) !== target) location.hash = `#${target}`;
    return;
  }
  if (location.hash.slice(1) !== target) location.hash = `#${target === "home" ? "" : target}`;
  render();
}

window.addEventListener("hashchange", () => {
  const target = location.hash.slice(1) || "home";
  if (target === "study" && state.view === "study") return;
  if (target === "arcade" && state.view === "arcade") return;
  if (MODES[target] && state.round && state.round.mode === target) return;
  go(target);
});

/* =========================================================================
   Arcade (maze mini-game)
   ========================================================================= */

/* The simulation, the maze and the monsters live in arcade.js; this section
   owns the screen, the words that sit on the board and the score. */
const ARCADE_WORDS = 4;
const ARCADE_KEYS = {
  ArrowUp: "up",
  ArrowDown: "down",
  ArrowLeft: "left",
  ArrowRight: "right"
};

/** Verbs of the current level, weighted so the failed ones come back more. */
function arcadeVerb() {
  const [verb] = weightedSample(verbsOfLevel(), 1, weightOf);
  return verb || VERBS[0];
}

/** The single-word past form the alien has to collect. */
function arcadeAnswer(verb) {
  return firstForm(verb.past);
}

/** Another verb of the level, so the word on top always actually changes. */
function arcadeNextVerb(current) {
  let verb = arcadeVerb();
  for (let attempt = 0; attempt < 12 && current && verb.base === current.base; attempt += 1) {
    verb = arcadeVerb();
  }
  return verb;
}

/**
 * The four signs of one round: the right past form plus three look-alikes from
 * the same level. Other forms of the same verb (was / were) never qualify as a
 * wrong answer, or the round would have two good ones.
 */
function arcadeWords(target) {
  const correct = arcadeAnswer(target);
  const own = new Set(formsOf(target.past).map((word) => word.toLowerCase()));
  const wrong = shuffle(
    poolFor("past").filter(
      (word) => !own.has(word.toLowerCase()) && word.toLowerCase() !== correct.toLowerCase()
    )
  ).slice(0, Math.max(1, ARCADE_WORDS - 1));
  return shuffle(
    [correct, ...wrong].map((text) => ({ text, correct: text.toLowerCase() === correct.toLowerCase() }))
  );
}

function startArcade() {
  stopConfetti();
  stopArcade();
  const target = arcadeVerb();
  const game = ArcadeGame.create();
  state.arcade = {
    game,
    target,
    score: 0,
    frame: 0,
    last: 0,
    stopped: false
  };
  ArcadeGame.placeWords(game, arcadeWords(target));
  state.view = "arcade";
  render();
}

function stopArcade() {
  const session = state.arcade;
  if (!session) return;
  session.stopped = true;
  if (session.frame) cancelAnimationFrame(session.frame);
  session.frame = 0;
  state.arcade = null;
}

/** Canvas in CSS pixels, backed by device pixels so it stays sharp. */
function prepareArcadeCanvas(canvas, game) {
  if (!canvas) return null;
  const width = game.cols * game.tile;
  const height = game.rows * game.tile;
  const scale = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  canvas.style.aspectRatio = `${width} / ${height}`;
  game.scale = scale;
  const ctx = canvas.getContext("2d");
  if (!ctx) return null;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  return ctx;
}

function arcadeSize(game) {
  return { width: game.cols * game.tile, height: game.rows * game.tile };
}

function paintArcade(session) {
  const { game } = session;
  const canvas = view.querySelector(".arcade__canvas");
  if (!canvas) return;
  const ctx = session.ctx || prepareArcadeCanvas(canvas, game);
  session.ctx = ctx;
  ArcadeGame.draw(ctx, game, arcadeSize(game));
}

/** Only the live values are patched, so the loop never rebuilds the DOM. */
function paintArcadeHud(session) {
  const verb = view.querySelector(".arcade__verb");
  if (verb) verb.textContent = session.target ? session.target.base : "—";
  const points = view.querySelector(".arcade__points");
  if (points) points.textContent = session.score;
  const stars = document.getElementById("stat-stars");
  if (stars) stars.textContent = profile.stars;
}

function renderArcade() {
  const session = state.arcade;
  if (!session) {
    state.view = "home";
    renderHome();
    return;
  }
  session.ctx = null;
  view.innerHTML = `
    <div class="arcade">
      <div class="arcade__hud">
        <div class="arcade__target">
          <span class="arcade__label">Pasado de</span>
          <b class="arcade__verb" lang="en">—</b>
        </div>
        <div class="arcade__score" title="Aciertos de esta partida">⭐ <b class="arcade__points">0</b></div>
      </div>
      <div class="arcade__stage">
        <canvas class="arcade__canvas" role="img" aria-label="Laberinto del arcade"></canvas>
      </div>
      <p class="arcade__hint">Muévete con las flechas del teclado y esquiva a los monstruos.</p>
      <div class="arcade__actions">
        <button class="btn btn--ghost" data-action="home">Salir al inicio</button>
      </div>
    </div>`;
  paintArcadeHud(session);
  paintArcade(session);
  startArcadeLoop(session);

function renderArcadeOver() {
  const session = state.arcade;
  if (!session) return;
  view.innerHTML = `
    <div class="arcade">
      <div class="arcade__hud">
        <div class="arcade__target">
          <span class="arcade__label">Te quedabas en</span>
          <b class="arcade__verb" lang="en">${esc(session.target ? session.target.base : "")}</b>
        </div>
        <div class="arcade__score">⭐ <b>${session.score}</b></div>
      </div>
      <div class="arcade__over">
        <span aria-hidden="true" style="font-size:2rem">👾</span>
        <h2>¡Te ha pillado un monstruo!</h2>
        <p>Has recogido <b>${session.score}</b> ${session.score === 1 ? "palabra" : "palabras"}.</p>
        <p>Tu récord en el arcade: <b>${profile.arcadeBest}</b></p>
        <button class="btn btn--primary" data-action="play" data-mode="arcade">Jugar otra vez 👾</button>
        <button class="btn btn--ghost" data-action="home">Volver al inicio</button>
      </div>
    </div>`;
}

function startArcadeLoop(session) {
  if (session.frame) cancelAnimationFrame(session.frame);
  session.stopped = false;
  session.last = 0;
  const frame = (now) => {
    if (session.stopped || state.arcade !== session || state.view !== "arcade") return;
    if (!session.last) session.last = now;
    const elapsed = now - session.last;
    session.last = now;
    stepArcade(session, elapsed);
    if (session.stopped || state.view !== "arcade") return;
    session.frame = requestAnimationFrame(frame);
  };
  session.frame = requestAnimationFrame(frame);
}

function stepArcade(session, elapsed) {
  const events = ArcadeGame.tick(session.game, elapsed);
  if (events.word) collectArcadeWord(session, events.word);
  if (events.caught) {
    finishArcade(session);
    return;
  }
  paintArcade(session);
}

/** Walking onto a sign: the right one scores and brings a new verb along. */
function collectArcadeWord(session, word) {
  const { target } = session;
  if (!word.correct) {
    recordAnswer(target, false);
    Sfx.wrong();
    return;
  }
  session.score += 1;
  session.target = arcadeNextVerb(target);
  ArcadeGame.placeWords(session.game, arcadeWords(session.target));
  recordAnswer(target, true);
  profile.stars += 1;
  saveProfile();
  paintArcadeHud(session);
  Sfx.right();
}

function finishArcade(session) {
  session.stopped = true;
  if (session.frame) cancelAnimationFrame(session.frame);
  session.frame = 0;
  paintArcade(session);
  profile.arcadeBest = Math.max(profile.arcadeBest || 0, session.score);
  profile.rounds += 1;
  saveProfile();
  renderArcadeOver();
}

/* =========================================================================
   Round interaction
   ========================================================================= */

function speakCurrentIfNeeded() {
  const round = state.round;
  if (!round) return;
  const item = round.items[round.index];
  if (!item) return;
  if (round.mode === "listen" && !round.answered) Player.say([clipEntry(item.verb, item.form)], item.heard);
}

function answer(optionIndex) {
  const round = state.round;
  if (!round || round.answered) return;
  const item = round.items[round.index];
  const chosen = item.options[optionIndex];
  if (chosen === undefined) return;

  const isRight = chosen === item.correct;
  round.answered = { index: optionIndex, right: isRight };
  round.answers = round.answers || {};
  round.answers[round.index] = isRight;
  recordAnswer(item.verb, isRight);

  if (isRight) {
    round.score += 1;
    round.starsEarned += 1;
    round.streak += 1;
    round.bestStreak = Math.max(round.bestStreak, round.streak);
    profile.stars += 1;
    profile.bestStreak = Math.max(profile.bestStreak, round.streak);
    Sfx.right();
  } else {
    round.streak = 0;
    if (!round.misses.includes(item.verb.base)) round.misses.push(item.verb.base);
    Sfx.wrong();
  }
  saveProfile();
  render();

  const feedback = view.querySelector(".feedback");
  if (feedback) feedback.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function nextQuestion() {
  const round = state.round;
  if (!round || !round.answered) return;
  round.answered = null;
  round.index += 1;

  if (round.index >= round.items.length) {
    profile.rounds += 1;
    saveProfile();
    render();
    if (round.score / round.items.length >= 0.5) {
      confetti();
      Sfx.finish();
    }
    return;
  }
  render();
  speakCurrentIfNeeded();
}

/* =========================================================================
   Events
   ========================================================================= */

/* The brand button lives in the top bar, outside #view, so click delegation
   sits on the document. */
document.addEventListener("click", (event) => {
  const trigger = event.target instanceof Element ? event.target.closest("[data-action]") : null;
  if (!trigger) return;
  const { action } = trigger.dataset;

  if (action === "home") { go("home"); return; }
  if (action === "study") { go("study"); return; }
  if (action === "play") { go(trigger.dataset.mode); return; }
  if (action === "set-level") { setLevel(Number(trigger.dataset.level)); return; }

  if (action === "speak") {
    let clips = [];
    let texts = [];
    try {
      clips = JSON.parse(trigger.dataset.clips || "[]");
    } catch {
      clips = [];
    }
    try {
      texts = JSON.parse(trigger.dataset.clipTexts || "[]");
    } catch {
      texts = [];
    }
    if (texts.length === 0) {
      // Older markup without per-clip texts: read the fallback once, instead of
      // repeating the same sentence for every clip in the list.
      Player.say(
        clips.map((clip, i) => ({ clip, text: i === 0 ? trigger.dataset.say : "" })),
        trigger.dataset.say
      );
      return;
    }
    Player.say(
      clips.map((clip, i) => ({ clip, text: texts[i] || "" })),
      trigger.dataset.say
    );
    return;
  }

  if (action === "study-prev") {
    state.study.index = Math.max(0, state.study.index - 1);
    renderStudy();
    return;
  }
  if (action === "study-next") {
    state.study.index = Math.min(verbsOfLevel().length - 1, state.study.index + 1);
    renderStudy();
    return;
  }
  if (action === "study-jump") {
    state.study.index = Number(trigger.dataset.index) || 0;
    renderStudy();
    const card = view.querySelector(".verb-card");
    if (card) card.scrollIntoView({ block: "start", behavior: "smooth" });
    return;
  }

  if (action === "answer") { answer(Number(trigger.dataset.index)); return; }
  if (action === "next") { nextQuestion(); return; }
});

view.addEventListener("input", (event) => {
  const input = event.target instanceof Element ? event.target.closest('[data-role="study-filter"]') : null;
  if (!input) return;
  state.study.filter = input.value;
  const caret = input.selectionStart;
  renderStudy();
  const next = view.querySelector('[data-role="study-filter"]');
  if (next) {
    next.focus();
    next.setSelectionRange(caret, caret);
  }
});

document.addEventListener("keydown", (event) => {
  if (event.target instanceof Element && event.target.closest("input, textarea")) return;

  if (state.view === "play" && state.round) {
    const round = state.round;
    if (/^[1-4]$/.test(event.key) && !round.answered) {
      answer(Number(event.key) - 1);
      event.preventDefault();
    } else if ((event.key === "Enter" || event.key === " ") && round.answered) {
      nextQuestion();
      event.preventDefault();
    }
    return;
  }

  if (state.view === "arcade") {
    const direction = ARCADE_KEYS[event.key];
    if (direction && state.arcade) {
      ArcadeGame.setDirection(state.arcade.game, direction);
      event.preventDefault();
    }
    return;
  }

  if (state.view === "study") {
    if (event.key === "ArrowRight") { state.study.index = Math.min(verbsOfLevel().length - 1, state.study.index + 1); renderStudy(); }
    if (event.key === "ArrowLeft") { state.study.index = Math.max(0, state.study.index - 1); renderStudy(); }
  }
});

/* =========================================================================
   Boot
   ========================================================================= */

// Small debug hook: handy for teachers/tests to inspect the round without cheating.
window.IVG = {
  get state() { return state; },
  get profile() { return profile; },
  get verbs() { return VERBS; },
  get player() { return Player; },
  get arcade() { return state.arcade; },
  reset() {
    profile = { ...EMPTY_PROFILE };
    saveProfile();
    state.study = { index: 0, filter: "" };
    go("home");
  }
};

Speech.onChange((missing) => {
  if (missing) console.info("[verbos] no English system voice: recorded clips will be used");
});

Player.probe(clipOf(VERBS[0], "base")).then((ok) => {
  state.audioMissing = !ok;
  if (state.view === "home") renderHome();
  if (!ok) console.info("[verbos] no recorded audio found: falling back to the browser voice");
});

const initial = location.hash.slice(1);
if (initial === "arcade") startArcade();
else if (MODES[initial]) startRound(initial);
else if (initial === "study") { state.view = "study"; render(); }
else render();
</script>
</body>
</html>
